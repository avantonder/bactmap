name: fastq_scan_parse
description: Creates a summary of FASTQ quality statistics for a set of samples based
  on the output from fastq-scan
keywords:
  - FASTQ
  - quality
  - statistics
  - summary
tools:
  - python:
      description: |
        Python is a programming language that lets you work quickly and integrate
        systems more effectively.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
      identifier: ""
  - pandas:
      description: |
        pandas is a fast, powerful, flexible and easy to use open source data
        analysis and manipulation tool built on top of Python.
      homepage: https://pandas.pydata.org/
      documentation: https://pandas.pydata.org/docs/
      licence: ["BSD-3-Clause"]
      identifier: ""
input:
  - - json:
        type: file
        description: |
          fastq-scan output files in JSON format
        pattern: "*.json"
        ontologies: []
output:
  tsv:
    - - "*.tsv":
          type: file
          description: Summary of FASTQ quality statistics for all samples in TSV format
          pattern: "*.tsv"
          ontologies: []
  versions_fastq_scan_parse:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - "python --version | sed 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - "python --version | sed 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@avantonder"
maintainers:
  - "@avantonder"
